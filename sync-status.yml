name: Sync Phase 11 plot status

# Runs on a schedule, and lets you trigger it manually from the Actions tab
# to test it before trusting the schedule.
on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours, all day — edit the "*/3" to change frequency
  workflow_dispatch: {}      # adds a "Run workflow" button in the GitHub UI

# Needed so the workflow is allowed to commit status.json back to the repo
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r nuca-sync/requirements.txt

      - name: Run scraper
        working-directory: nuca-sync
        run: python scraper.py --out ../status.json

      - name: Send Telegram alerts for new reservations
        working-directory: nuca-sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py

      - name: Commit updated status.json (if changed)
        run: |
          git config user.name "phase11-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-sync plot status $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
