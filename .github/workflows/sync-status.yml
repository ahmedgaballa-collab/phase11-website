name: Sync Phase 11 plot status

# Runs on a schedule, and lets you trigger it manually from the Actions tab
# to test it before trusting the schedule.
on:
  schedule:
    - cron: "0 * * * *"   # TEMP: every hour, just to measure real full-run duration — see README.md
  workflow_dispatch:
    inputs:
      test:
        description: "Test mode: crawl only المنيا الجديدة only, for a quick sanity check"
        type: boolean
        default: false
      # adds a “Run workflow” button in the GitHub UI, with an optional test-mode checkbox

# If a run is still going when the next one is scheduled, the new one waits
# in the queue instead of cancelling the run in progress — avoids losing a
# sync that's midway through.
concurrency:
  group: phase11-sync
  cancel-in-progress: false

# Needed so the workflow is allowed to commit status.json back to the repo
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py --out status.json ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && '--test' || '' }}

      - name: Send Telegram alerts for new reservations
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py

      - name: Commit updated status.json (if changed)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test) }}
        run: |
          git config user.name "phase11-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json daily_stats.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-sync plot status $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
