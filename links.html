.logo{width:92px;height:auto}
h1{font-size:30px;font-weight:800;margin-top:16px}
.en{font-family:'Cinzel',serif;font-size:12px;letter-spacing:4px;color:#e2c27e;margin-top:4px}
.line{width:90px;height:2px;background:linear-gradient(90deg,transparent,#c9a35e,transparent);margin:22px 0 24px}
.list{width:100%;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:16px;text-decoration:none;color:#f3efe6;background:rgba(255,255,255,.04);border:1.5px solid rgba(201,163,94,.35);transition:transform .15s,border-color .15s,background .15s}
.btn:hover,.btn:focus-visible{border-color:#e2c27e;background:rgba(201,163,94,.1);transform:translateY(-2px);outline:none}
.ic{width:46px;height:46px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#0b1226;background:linear-gradient(135deg,#f6dc9a,#c9a35e 50%,#8a6526)}
.ic svg{width:24px;height:24px}
.tx{display:flex;flex-direction:column;flex:1;min-width:0}
.tx b{font-size:18px;font-weight:700}
.tx small{font-size:14px;color:#c8b98f;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.ar{font-size:26px;color:#c9a35e;line-height:1}
.main{background:linear-gradient(135deg,#f6dc9a,#c9a35e 55%,#a07a36);border-color:transparent;color:#0b1226}
.main .ic{background:#0b1226;color:#e2c27e}
.main .tx small{color:#2a2410;font-weight:700}
.main .ar{color:#0b1226}
.main:hover{background:linear-gradient(135deg,#fbe6b0,#d4b06c 55%,#a07a36)}
footer{margin-top:30px;font-size:13px;color:#7f88a3;text-align:center;line-height:1.7}
</style>
