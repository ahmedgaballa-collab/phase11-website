*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:15px;line-height:1.55;

.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:16px;flex:none}
.icon-btn:hover{border-color:var(--gold)}

.list{overflow:auto;padding:0 6px 8px;border-top:1px solid var(--line)}

.z{display:flex;align-items:center;gap:8px;width:100%;text-align:start;border:0;background:none;color:var(--ink);font:inherit;font-size:13.5px;padding:7px 8px;border-radius:10px;cursor:pointer}

.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45);display:grid;place-items:center}

.pop .bar{height:6px;background:#EDF1F6;border-radius:9px;overflow:hidden;margin:6px 0}
.pop .bar i{display:block;height:100%;background:#0B1F3F}
.pop .btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pop .btns a,.pop .btns button{flex:1;text-align:center;border:0;border-radius:10px;padding:8px 10px;font:700 13px Tajawal,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}

.ed{position:fixed;z-index:600;bottom:14px;right:12px;width:min(360px,calc(100% - 24px));background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);display:grid;gap:6px;font-size:13px}
.ed small{color:var(--ink-3)}
.ed label{display:flex;align-items:center;gap:8px}.ed label input{flex:1}.ed label span{min-width:44px;color:var(--gold-ink);font-weight:700}
.ed .row2{display:flex;gap:8px}.ed .row2 button{flex:1;border:0;border-radius:10px;padding:8px;font:inherit;font-weight:800;cursor:pointer;background:var(--ink);color:var(--surface)}
.ed textarea{height:40px;font-size:11px;direction:ltr}
@media (max-width:720px){
  .side{top:auto;bottom:12px;inset-inline-end:12px;max-height:46%}
  .side.min .list,.side.min .q,.side.min p,.side.min .legend{display:none}
  .tog{display:block;position:absolute;top:8px;inset-inline-start:10px;border:0;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
  .brand small{display:none}
}

<script>
const SB = "https://mupmkecxgnickmbdvlno.supabase.co/rest/v1/";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11cG1rZWN4Z25pY2ttYmR2bG5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTY3NTAsImV4cCI6MjEwNTU3Mjc1MH0.Y5fHBT7cRfYB-CG2v674l_FH7kYs7ZQjE5bd5bQ0AzI";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "—" : Math.round(n).toLocaleString("en-US");
const col = z => !z ? "#7D889C" : !z.available ? "#A23B3B" : z.available / Math.max(1, z.total_plots) < .2 ? "#C9A44C" : "#1F8A4C";

const map = L.map("map", {zoomControl: false, attributionControl: true, maxZoom: 20}).setView([29.6, 31.2], 6);
L.control.zoom({position: "topright"}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 20, maxNativeZoom: 18, attribution: "Imagery © Esri, Maxar, Earthstar Geographics"}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {maxZoom: 20, maxNativeZoom: 18, opacity: .9}).addTo(map);

const EDIT = /[?&#]edit/.test(location.search + location.hash), ONLYMISS = EDIT && /[?&#]missing/.test(location.search + location.hash);
let MAPS = [], STATS = new Map(), markers = new Map(), GEO = {};
try { if (EDIT) GEO = JSON.parse(localStorage.getItem("ag-geo") || "{}"); } catch (e) {}
const AUTO = {}; // zid -> automatic placement: NUCA location pin, scale from the plots' real areas, north up
const F = {city: "", st: ""};
const passF = m => { if (F.city && m.city !== F.city) return false; const z = STATS.get(String(m.zid)); if (F.st === "av") return !z || z.available > 0; if (F.st === "done") return z && !z.available; return true; };
// only zones Ahmed placed by hand are drawn on the ground; the editor still needs a starting guess for the rest
const geoOf = m => GEO[m.zid] || m.geo || (EDIT && m.loc ? (AUTO[m.zid] || {c: m.loc, r: 0, s: 0, auto: 1}) : null);

/* ---------- the live zone map placed on the ground: an image (canvas) stretched between 3 corner points ---------- */
const Placed = L.Layer.extend({
  initialize(cv){ this.cv = cv; this.op = .9; },
  onAdd(m){ this._m = m; this.cv.className = "leaflet-zoom-hide"; this.cv.style.cssText = "position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;opacity:" + this.op;
    m.getPanes().overlayPane.appendChild(this.cv); m.on("zoomend viewreset moveend", this._up, this); this._up(); },
  onRemove(m){ this.cv.remove(); m.off("zoomend viewreset moveend", this._up, this); },
  setCorners(tl, tr, bl){ this.c = [tl, tr, bl]; if (this._m) this._up(); },
  setOpacity(o){ this.op = o; this.cv.style.opacity = o; },
  _up(){ if (!this.c || !this._m) return; const [a, b, c] = this.c.map(p => this._m.latLngToLayerPoint(p)), w = this.cv.width, h = this.cv.height;
    this.cv.style.transform = `matrix(${(b.x - a.x) / w},${(b.y - a.y) / w},${(c.x - a.x) / h},${(c.y - a.y) / h},${a.x},${a.y})`; }
});
function corners(g, O){ // image-pixel corners of the crop -> lat/lng, given centre, rotation (deg, clockwise) and metres per pixel
  // g.c = where the centre of the whole map image sits on the ground
  const W2 = O.it.w / 2, H2 = O.it.h / 2, r = g.r * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r), k = Math.cos(g.c[0] * Math.PI / 180);
  const at = (x, y) => { const u = x - W2, v = y - H2, e = g.s * (u * cs - v * sn), so = g.s * (u * sn + v * cs); return L.latLng(g.c[0] - so / 111320, g.c[1] + e / (111320 * k)); };
  return [at(O.crop[0], O.crop[1]), at(O.crop[2], O.crop[1]), at(O.crop[0], O.crop[3])];
}
const OV = new Map(); // zid -> {O, layer}
async function showZone(m){
  let e = OV.get(m.zid); if (e && e.busy) return e.busy;
  if (!e){ e = {}; OV.set(m.zid, e);
    e.busy = AGMaps.overlay(m.i, EDIT ? 1 : 2, EDIT).then(O => { e.O = O; e.layer = new Placed(O.canvas); e.busy = null; return e; }); await e.busy; }
  let g = geoOf(m) || {c: m.loc, r: 0, s: 0, auto: 1};
  if (!g.s){ const s0 = e.O.mpp || .5, P = m.plots, px = P.reduce((a, p) => a + p[2], 0) / P.length - m.w / 2, py = P.reduce((a, p) => a + p[3], 0) / P.length - m.h / 2;
    g = AUTO[m.zid] = {c: [g.c[0] + py * s0 / 111320, g.c[1] - px * s0 / (111320 * Math.cos(g.c[0] * Math.PI / 180))], r: 0, s: s0, auto: 1}; }
  e.g = g; e.layer.setCorners(...corners(g, e.O)); if (!map.hasLayer(e.layer)) e.layer.addTo(map); return e;
}
function hideZone(m){ const e = OV.get(m.zid); if (e && e.layer && map.hasLayer(e.layer)) e.layer.remove(); }
function refreshOverlays(){
  if (EDIT) return;
  const show = map.getZoom() >= 14, b = map.getBounds().pad(.3);
  MAPS.forEach(m => { const g = geoOf(m); if (!g || m.zid === "4803") return; if (!passF(m)) return hideZone(m); if (show && b.contains(g.c)) showZone(m); else hideZone(m); });
}
map.on("moveend zoomend", refreshOverlays);

/* ---------- pins, list ---------- */
function popup(m){
  const z = STATS.get(String(m.zid)), pct = z ? Math.round(100 * z.booked / Math.max(1, z.total_plots)) : 0;
  const g = `https://www.google.com/maps?q=${m.loc[0]},${m.loc[1]}`, live = m.zid === "4803" ? null : geoOf(m);
  return `<div class="pop"><small>${esc(m.city)}</small><h3>${esc(m.area)}</h3>
    ${z ? `<div>متاح <b>${fmt(z.available)}</b> من ${fmt(z.total_plots)} قطعة</div><div class="bar"><i style="width:${pct}%"></i></div>` : ""}
    <div class="btns">${live ? `<button class="b1" type="button" data-zoom="${m.i}">🛰 شوفها على الأرض</button>` : ""}<button class="${live ? "b2" : "b1"}" type="button" data-open="${m.i}">🗺 خريطة القطع</button><a class="b2" href="${g}" target="_blank" rel="noopener">📍 جوجل ماب</a><button class="b2" type="button" data-dl="${m.i}">⬇ تنزيل</button></div>
    ${m.locApprox ? `<div class="note">المكان تقريبي (على مستوى المدينة)</div>` : live && live.auto ? `<div class="note" style="color:#8F6E1F">الخريطة متحطوطة على مكانها تقريبيًا</div>` : ""}</div>`;
}
function pinIcon(m){
  const z = STATS.get(String(m.zid));
  return L.divIcon({className: "", iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28],
    html: `<div class="pin" style="background:${col(z)}"><span>${z ? fmt(z.available) : ""}</span></div>`});
}
function draw(){
  markers.forEach(mk => mk.remove()); markers.clear();
  const pts = [];
  MAPS.filter(m => m.loc && passF(m)).forEach(m => {
    const mk = L.marker(m.loc, {icon: pinIcon(m), title: m.city + " — " + m.area}).addTo(map).bindPopup(() => popup(m));
    markers.set(m.i, mk); pts.push(m.loc);
  });
  if (pts.length && !draw.done && !EDIT){ map.fitBounds(pts, {padding: [40, 40]}); draw.done = 1; }
  renderList(); refreshOverlays();
}
function renderList(){
  const q = AGMaps.norm($("q").value), by = new Map();
  MAPS.filter(m => m.loc && passF(m) && (!ONLYMISS || m.noLink) && (!q || AGMaps.norm(m.city + " " + m.area).includes(q))).forEach(m => { if (!by.has(m.city)) by.set(m.city, []); by.get(m.city).push(m); });
  $("list").innerHTML = [...by].map(([c, ms]) => `<div class="city">${esc(c)}</div>` + ms.map(m => { const z = STATS.get(String(m.zid));
    return `<button class="z" type="button" data-go="${m.i}"><i style="background:${col(z)}"></i><span>${m.noLink ? "⚠ " : ""}${esc(m.area)}${geoOf(m) && !m.noLink ? " 🛰" : ""}</span><b>${z ? fmt(z.available) + " متاح" : ""}</b></button>`; }).join("")).join("")
    || `<div class="city" style="color:var(--ink-3)">مفيش نتايج</div>`;
}
function goZone(i){ const m = MAPS[i], g = geoOf(m);
  if (EDIT) return editZone(m);
  if (g){ map.flyTo(g.c, 16, {duration: .9}); } else { const mk = markers.get(i); map.flyTo(mk.getLatLng(), 15, {duration: .8}); setTimeout(() => mk.openPopup(), 850); }
  if (innerWidth <= 720) $("side").classList.add("min"); }
$("list").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) goZone(+b.dataset.go); });
$("q").addEventListener("input", renderList);
$("tog").addEventListener("click", () => $("side").classList.toggle("min"));
map.on("popupopen", e => { const el = e.popup.getElement(), b = el.querySelector("[data-open]"), z = el.querySelector("[data-zoom]");
  if (b) b.onclick = () => { const i = +b.dataset.open, c = MAPS[i].city; AGMaps.open(i, MAPS.filter(m => m.city === c)); };
  if (z) z.onclick = () => { map.closePopup(); goZone(+z.dataset.zoom); };
  const d = el.querySelector("[data-dl]"); if (d) d.onclick = () => dlZone(MAPS[+d.dataset.dl]); });

/* ---------- alignment editor (?edit): place each zone map on the ground, then send the numbers ---------- */
let cur = null, handle = null;
var saveGeo = function(){ try { localStorage.setItem("ag-geo", JSON.stringify(GEO)); } catch (e) {} if ($("edOut")) $("edOut").value = JSON.stringify(Object.fromEntries(Object.entries(GEO).filter(([k, g]) => g.ok).map(([k, g]) => [k, [g.c[0], g.c[1], g.r, g.s]]))); };
/* two-point calibration: tap a spot on the zone map, then the same spot on the satellite — twice */
let IM = null, IML = null, PTS = [], pmk = [];
function calSet(msg){ $("edMsg").innerHTML = msg; }
function calStep(){ const n = PTS.length, side = n % 2 ? "الصورة على <b>القمر الصناعي</b>" : "<b>خريطة القطع</b> (شمال)";
  if (n >= 4) return calSet("✓ اتركبت — شوف الشفافية تحت، ولو تمام دوس <b>حفظ</b>");
  calSet(`نقطة ${(n >> 1) + 1} من 2: دوس على ركن واضح في ${side}`); }
function calPin(mapObj, ll, k){ return L.marker(ll, {interactive: false, icon: L.divIcon({className: "", iconSize: [24, 24], iconAnchor: [12, 12],
  html: `<div style="width:24px;height:24px;border-radius:50%;background:${k < 2 ? "#E8432E" : "#2E7DE8"};color:#fff;border:2px solid #fff;font:800 12px Tajawal;display:grid;place-items:center;box-shadow:0 2px 6px #0009">${k < 2 ? 1 : 2}</div>`})}).addTo(mapObj); }
function calSolve(){
  const m = cur, e = OV.get(m.zid); if (!e || PTS.length < 4) return;
  const [i1, g1, i2, g2] = PTS, k = Math.cos(g1.lat * Math.PI / 180);
  const I = p => [p.x - m.w / 2, p.y - m.h / 2], G = p => [(p.lng - g1.lng) * 111320 * k, -(p.lat - g1.lat) * 111320];
  const a1 = I(i1), a2 = I(i2), b1 = G(g1), b2 = G(g2);
  const dx = a2[0] - a1[0], dy = a2[1] - a1[1], ex = b2[0] - b1[0], ey = b2[1] - b1[1], den = dx * dx + dy * dy;
  if (den < 100) return calSet("النقطتين قريبين أوي من بعض — اختار ركنين بعاد عن بعض");
  const ar = (ex * dx + ey * dy) / den, ai = (ey * dx - ex * dy) / den; // complex ratio
  const tx = b1[0] - (ar * a1[0] - ai * a1[1]), ty = b1[1] - (ar * a1[1] + ai * a1[0]); // ground (local m) of image centre
  GEO[m.zid] = {c: [+(g1.lat - ty / 111320).toFixed(7), +(g1.lng + tx / (111320 * k)).toFixed(7)], r: +(Math.atan2(ai, ar) * 180 / Math.PI).toFixed(2), s: +Math.hypot(ar, ai).toFixed(5)};
  e.layer.setCorners(...corners(GEO[m.zid], e.O)); e.layer.setOpacity($("edO").value / 100); if (!map.hasLayer(e.layer)) e.layer.addTo(map);
  saveGeo(); calStep();
}
async function editZone(m){
  cur = m; PTS = []; pmk.forEach(x => x.remove()); pmk = [];
  $("edName").textContent = m.city + " — " + m.area; calSet("جاري التحميل…");
  OV.forEach((e, z) => { if (z !== m.zid) hideZone({zid: z}); });
  const e = await showZone(m); e.layer.setOpacity($("edO").value / 100);
  if (IML) IML.remove(); const bnds = [[0, 0], [m.h, m.w]];
  IML = L.imageOverlay(m.file, bnds).addTo(IM); IM.fitBounds(bnds);
  const g = geoOf(m); map.setView(g ? g.c : m.loc, 16); calStep();
}
function apply(){ if (!cur) return; const e = OV.get(cur.zid); if (e && e.layer) e.layer.setOpacity($("edO").value / 100); }
if (EDIT){
  document.body.classList.add("cal");
  const box = document.createElement("div"); box.id = "imgmap"; document.body.appendChild(box);
  IM = L.map(box, {crs: L.CRS.Simple, minZoom: -4, maxZoom: 3, zoomSnap: .25, attributionControl: false});
  IM.setView([0, 0], -2); setTimeout(() => { map.invalidateSize(); IM.invalidateSize(); }, 300);
  const p = document.createElement("div"); p.className = "ed";
  p.innerHTML = `<b id="edName">اختار منطقة من القايمة</b><small id="edMsg">لكل منطقة: دوس على ركن في خريطة القطع، وبعدين على نفس الركن على القمر الصناعي. اعمل كده مرتين.</small>
    <label>الشفافية<input id="edO" type="range" min="15" max="100" value="65"></label>
    <div class="row2"><button type="button" id="edUndo">↩ تراجع</button><button type="button" id="edDone">✓ حفظ</button><button type="button" id="edCopy">نسخ البيانات</button></div>
    <small id="edCount"></small><textarea id="edOut" readonly></textarea>`;
  document.body.appendChild(p);
  $("edO").addEventListener("input", apply);
  IM.on("click", ev => { if (!cur || PTS.length % 2 === 1 || PTS.length >= 4) return;
    const pt = {x: ev.latlng.lng, y: cur.h - ev.latlng.lat}; PTS.push(pt); pmk.push(calPin(IM, ev.latlng, PTS.length - 1)); calStep(); });
  map.on("click", ev => { if (!cur || PTS.length % 2 === 0) return;
    PTS.push(ev.latlng); pmk.push(calPin(map, ev.latlng, PTS.length - 1)); if (PTS.length === 4) calSolve(); else calStep(); });
  $("edUndo").onclick = () => { if (!PTS.length) return; PTS.pop(); const x = pmk.pop(); x && x.remove(); calStep(); };
  $("edDone").onclick = () => { if (!cur || !GEO[cur.zid] || PTS.length < 4) return calSet("لسه محتاج النقطتين الأول"); GEO[cur.zid].ok = 1; saveGeo(); renderList();
    calSet("اتحفظت ✓ — اختار المنطقة اللي بعدها من القايمة"); };
  $("edCopy").onclick = () => { $("edOut").select(); try { navigator.clipboard.writeText($("edOut").value); } catch (e) {} calSet("اتنسخت — ابعتهالي"); };
  const cnt = () => { $("edCount").textContent = "اتظبط: " + Object.values(GEO).filter(g => g.ok).length + " منطقة"; };
  const sg = saveGeo; saveGeo = function(){ sg(); cnt(); }; saveGeo();
}

$("fCity").addEventListener("change", e => { F.city = e.target.value; draw.done = 0; draw(); const ms = MAPS.filter(m => m.loc && passF(m)); if (ms.length) map.fitBounds(ms.map(m => m.loc), {padding: [60, 60], maxZoom: 15}); });
$("fSt").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (!b) return; F.st = b.dataset.s; $("fSt").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); draw(); });
$("fBooked").addEventListener("change", e => { document.body.classList.toggle("nobk", !e.target.checked); OV.forEach(o => o.layer && (o.layer.cv.style.display = e.target.checked ? "" : "none")); });
$("fFull").addEventListener("click", () => { const d = document; if (!d.fullscreenElement) { (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen || (() => {})).call(d.documentElement); d.body.classList.add("full"); } else { d.exitFullscreen(); } });
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) document.body.classList.remove("full"); setTimeout(() => map.invalidateSize(), 200); });
// download: the zone in view (closest to the centre) as its full live map — booked plots coloured, live numbers
async function dlZone(m){
  const btn = $("fDl"), t = btn.innerHTML; btn.innerHTML = "⏳"; try {
    const O = await AGMaps.overlay(m.i, 1, true), c = O.canvas;
    const a = document.createElement("a"); a.download = (m.city + " - " + m.area).replace(/[\\/:*?"<>|]/g, "") + ".png";
    a.href = URL.createObjectURL(await new Promise(r => c.toBlob(r, "image/png"))); document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  } finally { btn.innerHTML = t; } }
$("fDl").addEventListener("click", () => { const c = map.getCenter(); let best = null, bd = 1e18;
  MAPS.forEach(m => { if (!m.loc || !passF(m)) return; const g = geoOf(m) || {c: m.loc}; const d = map.distance(c, g.c); if (d < bd){ bd = d; best = m; } });
  if (!best || (map.getZoom() < 12)) return alert("قرّب على منطقة الأول، أو اختار مدينة من الفلتر"); dlZone(best); });

(async () => {
  MAPS = await AGMaps.load();
  // editor: zones with no NUCA link start at the middle of their city, so they can be placed by hand
  if (EDIT) MAPS.forEach(m => { if (m.loc) return; const c = MAPS.filter(x => x.city === m.city && x.loc); if (c.length) { m.loc = [c.reduce((a, x) => a + x.loc[0], 0) / c.length, c.reduce((a, x) => a + x.loc[1], 0) / c.length]; m.noLink = 1; } });
  [...new Set(MAPS.filter(m => m.loc).map(m => m.city))].sort((a, b) => a.localeCompare(b, "ar")).forEach(c => { const o = document.createElement("option"); o.value = o.textContent = c; $("fCity").appendChild(o); });
  draw();
  try {
    const r = await fetch(SB + "v_stats_by_zone?select=zone_id,total_plots,booked,available", {cache: "no-store", headers: {apikey: KEY, Authorization: "Bearer " + KEY}});
    if (r.ok){ (await r.json()).forEach(z => STATS.set(String(z.zone_id), z)); draw(); }
    const zq = new URLSearchParams(location.search).get("zone"); if (zq){ const m = MAPS.find(x => x.zid === zq); if (m) setTimeout(() => goZone(m.i), 400); }
  } catch (e) { console.warn(e); }
})();

function paintThemeBtn(){ const d = document.documentElement.getAttribute("data-theme") === "dark"; $("themeBtn").textContent = d ? "☀" : "☾"; }
$("themeBtn").addEventListener("click", () => { const n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", n); try { localStorage.setItem("ag-theme", n); } catch (e) {} paintThemeBtn(); });
paintThemeBtn();
</script>
