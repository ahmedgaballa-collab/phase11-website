const EDIT = /[?&#]edit/.test(location.search + location.hash), ONLYMISS = EDIT && /[?&#]missing/.test(location.search + location.hash), ONLY = (new URLSearchParams(location.search).get("only") || "").split(",").filter(Boolean);
let MAPS = [], STATS = new Map(), markers = new Map(), GEO = {};

  initialize(cv){ this.cv = cv; this.op = .9; },
  onAdd(m){ this._m = m; this.cv.className = "leaflet-zoom-hide"; this.cv.style.cssText = "position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;opacity:" + this.op;

    this.cv.style.transform = `matrix(${(b.x - a.x) / w},${(b.y - a.y) / w},${(c.x - a.x) / h},${(c.y - a.y) / h},${a.x},${a.y})`; }
});
function corners(g, O){ // image-pixel corners of the crop -> lat/lng, given centre, rotation (deg, clockwise) and metres per pixel
  // g.c = where the centre of the whole map image sits on the ground
  const W2 = O.it.w / 2, H2 = O.it.h / 2, r = g.r * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r), k = Math.cos(g.c[0] * Math.PI / 180);

}
function hideZone(m){ const e = OV.get(m.zid); if (e && e.layer && map.hasLayer(e.layer)) e.layer.remove(); }
function refreshOverlays(){
  if (!EDIT) return refreshGround();
  return;
  const show = map.getZoom() >= 14, b = map.getBounds().pad(.3);
  MAPS.forEach(m => { const g = geoOf(m); if (!g || m.zid === "4803") return; if (!passF(m)) return hideZone(m); if (show && b.contains(g.c)) showZone(m); else hideZone(m); });

const UI = {op: .9, only: false, bk: true};
const Ground = L.Layer.extend({
  initialize(m){ this.m = m; const el = this.el = document.createElement("div"); el.className = "leaflet-zoom-hide";

    calSet("اتحفظت ✓ — اختار المنطقة اللي بعدها من القايمة"); };
  $("edCopy").onclick = () => { $("edOut").select(); try { navigator.clipboard.writeText($("edOut").value); } catch (e) {} calSet("اتنسخت — ابعتهالي"); };
  const cnt = () => { $("edCount").textContent = "اتظبط: " + Object.values(GEO).filter(g => g.ok).length + " منطقة"; };
  const sg = saveGeo; saveGeo = function(){ sg(); cnt(); }; saveGeo();
}

function syncUrl(){ const u = new URL(location.href); F.city ? u.searchParams.set("city", F.city) : u.searchParams.delete("city"); F.zones.size ? u.searchParams.set("zones", [...F.zones].join(",")) : u.searchParams.delete("zones"); history.replaceState(null, "", u);
  const v = new URL("/maps", location.origin); if (F.city) v.searchParams.set("city", F.city); if (F.zones.size) v.searchParams.set("zones", [...F.zones].join(",")); $("vCards").href = v.pathname + v.search; }
function fitSel(){ const ms = MAPS.filter(m => m.loc && passF(m)); if (ms.length) map.fitBounds(ms.map(m => (m.geo && m.geo.c) || m.loc), {padding: [60, 60], maxZoom: F.zones.size ? 17 : 15}); }
function renderZsel(){ $("zsel").hidden = !F.city; if (!F.city) return; const zs = MAPS.filter(m => m.city === F.city && m.loc);
  $("zCnt").textContent = F.zones.size ? F.zones.size + " من " + zs.length : "الكل";
  $("zPan").innerHTML = `<label class="zall"><input type="checkbox" data-all ${F.zones.size ? "" : "checked"}> كل المناطق</label>` + zs.map(m => `<label><input type="checkbox" data-z="${m.zid}" ${F.zones.has(m.zid) ? "checked" : ""}> ${esc(m.area)}</label>`).join(""); }
$("fCity").addEventListener("change", e => { F.city = e.target.value; F.zones.clear(); syncUrl(); renderZsel(); draw.done = 1; draw(); fitSel(); });
$("zBtn").addEventListener("click", () => { $("zPan").hidden = !$("zPan").hidden; });
document.addEventListener("click", e => { if (!e.target.closest("#zsel")) $("zPan").hidden = true; });
$("zPan").addEventListener("change", e => { const t = e.target; if (t.dataset.all != null) F.zones.clear(); else if (t.dataset.z) { t.checked ? F.zones.add(t.dataset.z) : F.zones.delete(t.dataset.z); }
  syncUrl(); renderZsel(); $("zPan").hidden = false; draw(); fitSel(); });
$("fOp").addEventListener("input", e => { UI.op = e.target.value / 100; GL.forEach(x => x.layer.style()); });
$("fOnly").addEventListener("change", e => { UI.only = e.target.checked; GL.forEach(x => { x.layer.style(); paintZone(x.layer.m); }); });
$("fSt").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (!b) return; F.st = b.dataset.s; $("fSt").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); draw(); });
$("fBooked").addEventListener("change", e => { UI.bk = e.target.checked; GL.forEach(x => x.layer.style()); OV.forEach(o => o.layer && (o.layer.cv.style.display = e.target.checked ? "" : "none")); LB.draw(); });
$("fFull").addEventListener("click", () => { const d = document; if (!d.fullscreenElement) { (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen || (() => {})).call(d.documentElement); d.body.classList.add("full"); } else { d.exitFullscreen(); } });
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) document.body.classList.remove("full"); setTimeout(() => map.invalidateSize(), 200); });
// downloads: the chosen zones (or the one in view) as full live maps — booked plots coloured, live numbers
function dlTargets(){ const sel = MAPS.filter(m => m.loc && passF(m) && m.zid !== "4803");
  if (F.zones.size) return sel; const c = map.getCenter(); let best = null, bd = 1e18;
  sel.forEach(m => { const g = (m.geo && m.geo.c) || m.loc, d = map.distance(c, g); if (d < bd){ bd = d; best = m; } });
  return best && map.getZoom() >= 12 ? [best] : []; }
const fname = m => (m.city + " - " + m.area).replace(/[\\/:*?"<>|]/g, "");
function save(blob, name){ const a = document.createElement("a"); a.download = name; a.href = URL.createObjectURL(blob); document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000); }
function busy(on, msg){ let d = $("dlw"); if (on){ if (!d){ d = document.createElement("div"); d.id = "dlw"; d.className = "dlwait"; document.body.appendChild(d); } d.textContent = msg || "جاري التجهيز…"; } else if (d) d.remove(); }
async function dlZone(m, kind){ return kind === "pdf" ? dlPdf([m]) : dlPng([m]); }
async function dlPng(ms){ if (!ms.length) return alert("اختار منطقة من الفلتر أو قرّب عليها الأول");
  try { for (const [k, m] of ms.entries()){ busy(true, `جاري تجهيز الصورة ${k + 1} من ${ms.length}…`); const R = await AGMaps.renderFull(m.i, UI.only);
    save(await new Promise(r => R.canvas.toBlob(r, "image/png")), fname(m) + ".png"); } } finally { busy(false); } }
let jspdfP = null;
function jspdf(){ return jspdfP || (jspdfP = new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; sc.onload = () => ok(window.jspdf.jsPDF); sc.onerror = no; document.head.appendChild(sc); })); }
async function dlPdf(ms){ if (!ms.length) return alert("اختار منطقة من الفلتر أو قرّب عليها الأول");
  try { busy(true, "جاري تجهيز الـ PDF…"); const J = await jspdf(); let doc = null;
    for (const [k, m] of ms.entries()){ busy(true, `جاري تجهيز صفحة ${k + 1} من ${ms.length}…`); const R = await AGMaps.renderFull(m.i, UI.only), c = R.canvas, land = c.width >= c.height;
      if (!doc) doc = new J({orientation: land ? "l" : "p", unit: "pt", format: "a4"}); else doc.addPage("a4", land ? "l" : "p");
      const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight(), sc = Math.min((pw - 24) / c.width, (ph - 24) / c.height);
      doc.addImage(c.toDataURL("image/jpeg", .9), "JPEG", (pw - c.width * sc) / 2, (ph - c.height * sc) / 2, c.width * sc, c.height * sc); }
    save(doc.output("blob"), (ms.length === 1 ? fname(ms[0]) : (F.city || "خرائط المرحلة 11") + " - " + ms.length + " مناطق") + ".pdf");
  } catch (e) { alert("حصلت مشكلة في تجهيز الملف، جرّب تاني"); console.warn(e); } finally { busy(false); } }
$("fPng").addEventListener("click", () => dlPng(dlTargets()));
$("fPdf").addEventListener("click", () => dlPdf(dlTargets()));

(async () => {
  MAPS = await AGMaps.load();
  // editor: zones with no NUCA link start at the middle of their city, so they can be placed by hand
  if (EDIT) MAPS.forEach(m => { if (m.loc) return; const c = MAPS.filter(x => x.city === m.city && x.loc); if (c.length) { m.loc = [c.reduce((a, x) => a + x.loc[0], 0) / c.length, c.reduce((a, x) => a + x.loc[1], 0) / c.length]; m.noLink = 1; } });
  [...new Set(MAPS.filter(m => m.loc).map(m => m.city))].sort((a, b) => a.localeCompare(b, "ar")).forEach(c => { const o = document.createElement("option"); o.value = o.textContent = c; $("fCity").appendChild(o); });
  if (F.city) $("fCity").value = F.city; syncUrl(); renderZsel();
  if (F.city && !EDIT){ draw.done = 1; draw(); fitSel(); } else draw();
  try {
    const r = await fetch(SB + "v_stats_by_zone?select=zone_id,total_plots,booked,available", {cache: "no-store", headers: {apikey: KEY, Authorization: "Bearer " + KEY}});
    if (r.ok){ (await r.json()).forEach(z => STATS.set(String(z.zone_id), z)); draw(); }
    const zq = new URLSearchParams(location.search).get("zone"); if (zq){ const m = MAPS.find(x => x.zid === zq); if (m) setTimeout(() => goZone(m.i), 400); }
  } catch (e) { console.warn(e); }
})();

function paintThemeBtn(){ const d = document.documentElement.getAttribute("data-theme") === "dark"; $("themeBtn").textContent = d ? "☀" : "☾"; }
$("themeBtn").addEventListener("click", () => { const n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", n); try { localStorage.setItem("ag-theme", n); } catch (e) {} paintThemeBtn(); });
paintThemeBtn();
</script>
